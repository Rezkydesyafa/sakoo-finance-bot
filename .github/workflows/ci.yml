name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: "sqlite+pysqlite:///:memory:"
      JWT_SECRET: test-jwt-secret-minimum-32-characters
      TELEGRAM_BOT_TOKEN: "123456:test-token"
      TELEGRAM_WEBHOOK_SECRET: test-telegram-secret
      WAHA_SESSION_NAME: default
      STORAGE_PATH: ../storage
      MEDIA_RECEIPT_MAX_BYTES: 5242880
      OCR_DAILY_LIMIT_PER_USER: 20
      OCR_RATE_LIMIT_TIMEZONE: Asia/Jakarta
      TELEGRAM_REGISTER_COMMANDS_ON_STARTUP: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONPATH: ${{ github.workspace }}/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint backend
        run: ruff check app tests

      - name: Type-check backend
        run: pyright

      - name: Verify migrations
        run: python -m pytest -q tests/test_migrations.py

      - name: Run backend core tests
        run: >-
          python -m pytest -q
          tests/test_auth_isolation.py
          tests/test_bot_conversation_response.py
          tests/test_bot_feature_matrix.py
          tests/test_bot_youth_message_eval.py
          tests/test_budgets.py
          tests/test_health.py
          tests/test_hybrid_parser.py
          tests/test_llm_first_parser.py
          tests/test_llm_validator.py
          tests/test_media_storage.py
          tests/test_notifications.py

      - name: Run backend integration tests
        run: >-
          python -m pytest -q
          tests/test_channel_flow.py
          tests/test_ocr_google_vision.py
          tests/test_parser_model_service.py
          tests/test_parser_rules.py
          tests/test_receipt_parser.py
          tests/test_report_pdf.py
          tests/test_report_pdf_bot_delivery.py
          tests/test_reports_service.py
          tests/test_stt_google_speech.py
          tests/test_telegram_voice_stt.py
          tests/test_telegram_webhook.py
          tests/test_transactions_crud.py
          tests/test_waha_health.py
          tests/test_waha_receipt_ocr.py
          tests/test_waha_voice_stt.py

  frontend:
    name: Frontend Node.js 22
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint --if-present

      - name: Test frontend
        run: npm test --if-present

      - name: Build frontend
        run: npm run build --if-present

  build-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name prefix
        run: echo "IMAGE_PREFIX=ghcr.io/${OWNER,,}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/sakoo-backend:latest
            ${{ env.IMAGE_PREFIX }}/sakoo-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/sakoo-frontend:latest
            ${{ env.IMAGE_PREFIX }}/sakoo-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

