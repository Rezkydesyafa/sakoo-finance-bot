[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
# Start with the refactored boundaries; expand coverage as legacy modules are typed.
include = ["app/models", "app/modules/bot/channel_flow.py", "app/modules/llm"]
reportMissingTypeStubs = false
